<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Expense Tracker</title>
<style>
:root{--primary:#6200ea;--primary-dark:#4b00b5;--primary-light:#f1e8ff;--background:#f6f5fb;--surface:#fff;--text:#242033;--muted:#777386;--border:#e9e6f0;--danger:#d93045;--radius:16px;--shadow:0 4px 18px rgba(43,25,83,.07)}
*{box-sizing:border-box}
html{min-height:100%;-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;padding:0 0 calc(90px + env(safe-area-inset-bottom));font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px;line-height:1.5;color:var(--text);background:var(--background);-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;z-index:20;padding:17px 16px;padding-top:calc(17px + env(safe-area-inset-top));color:#fff;text-align:center;font-size:19px;font-weight:750;letter-spacing:.2px;background:linear-gradient(135deg,#6200ea,#7c35ed);box-shadow:0 3px 12px rgba(98,0,234,.18)}
.dashboard{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;padding:16px 14px 8px}
.card{min-width:0;padding:19px;text-align:left;background:var(--surface);border:1px solid rgba(98,0,234,.07);border-radius:var(--radius);box-shadow:var(--shadow)}
.card h3{margin:0 0 12px;color:var(--muted);font-size:13px;font-weight:650;letter-spacing:.4px;text-transform:uppercase}
#totalExpense{margin:14px 0 0;color:var(--primary);font-size:clamp(28px,8vw,36px);line-height:1.2;font-weight:800;letter-spacing:-.8px;overflow-wrap:anywhere}
input,select{display:block;width:100%;min-width:0;min-height:44px;margin:7px 0;padding:10px 12px;color:var(--text);font:inherit;font-size:14px;background:#fbfaff;border:1px solid #ded9e9;border-radius:10px;outline:none}
input:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(98,0,234,.1)}
input[type=date]{min-width:0;max-width:100%}
.date-range{display:none;margin-top:10px;padding-top:5px}.date-range label{display:block;margin:8px 0 3px;color:var(--muted);font-size:12px;font-weight:600}
.category-section{padding:15px 14px 18px}.category-section h3{margin:0 0 14px;font-size:17px;font-weight:750;letter-spacing:-.3px}
#categoryCards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.category-card{position:relative;min-width:0;min-height:102px;display:flex;flex-direction:column;justify-content:center;gap:7px;padding:15px 12px;overflow-wrap:anywhere;text-align:left;background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:0 2px 8px rgba(43,25,83,.04);cursor:pointer;transition:transform .15s,box-shadow .15s}
.category-card:active{transform:scale(.98)}.category-card h4{margin:0;color:var(--muted);font-size:12px;font-weight:650}.category-card p{margin:0;color:var(--primary);font-size:clamp(17px,4.5vw,21px);font-weight:800;letter-spacing:-.4px;overflow-wrap:anywhere}
.daily-table-wrapper{margin:0 14px 20px;overflow:auto;background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}.daily-table-wrapper table{margin:0}
th,td{padding:12px 10px;text-align:center;border:0;border-bottom:1px solid var(--border);white-space:nowrap}
th{position:sticky;top:0;z-index:2;color:#625b70;font-size:11px;font-weight:750;text-transform:uppercase;letter-spacing:.35px;background:#f3effb}
tbody tr:last-child td{border-bottom:0}.daily-table-wrapper tbody tr{cursor:pointer}.daily-table-wrapper tbody tr:active{background:var(--primary-light)}td{color:#393446}.daily-table-wrapper td:last-child{color:var(--primary);font-weight:750}
button{min-height:42px;padding:10px 15px;color:var(--text);font:inherit;font-weight:650;background:#efedf5;border:0;border-radius:10px;cursor:pointer;touch-action:manipulation;transition:background .15s,transform .15s}
button:active{transform:scale(.97)}button:disabled{opacity:.65;cursor:not-allowed}
.add-btn{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:30;display:flex;align-items:center;justify-content:center;width:58px;height:58px;min-height:58px;padding:0;color:#fff;font-size:34px;font-weight:400;line-height:1;background:linear-gradient(145deg,#7625ef,#5300cb);border-radius:50%;box-shadow:0 6px 18px rgba(98,0,234,.35)}
.modal{display:none;position:fixed;inset:0;z-index:100;align-items:center;justify-content:center;padding:12px;padding-top:max(12px,env(safe-area-inset-top));padding-bottom:max(12px,env(safe-area-inset-bottom));background:rgba(24,15,43,.58);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.modal-content{width:100%;max-width:440px;max-height:100%;min-width:0;padding:0;overflow:hidden;display:flex;flex-direction:column;background:#fff;border:1px solid rgba(255,255,255,.5);border-radius:18px;box-shadow:0 16px 55px rgba(20,10,40,.24)}
.modal-header{position:relative;z-index:5;display:flex;flex-shrink:0;align-items:center;justify-content:space-between;gap:12px;min-height:64px;padding:13px 16px;background:#fff;border-bottom:1px solid var(--border)}
.modal-header h3{flex:1;min-width:0;margin:0;font-size:18px;font-weight:750;line-height:1.35;overflow-wrap:anywhere}
.close-btn{display:flex;flex:0 0 40px;align-items:center;justify-content:center;width:40px;height:40px;min-height:40px;padding:0;color:#51485f;font-size:27px;font-weight:400;line-height:1;background:#f0edf5;border-radius:50%}
.modal-body{min-height:0;padding:15px;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#expenseModal .modal-body>select,#expenseModal .modal-body>input{margin:8px 0}
#product[style*="display: none"]{display:none!important}
#addItemBtn,#submitBtn{color:#fff;background:var(--primary)}
#addItemBtn{width:100%;margin:8px 0 14px}
#submitBtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:125px}
.modal-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.modal-actions button{flex:1}
.table-scroll{max-width:100%;overflow:auto;border:1px solid var(--border);border-radius:10px;-webkit-overflow-scrolling:touch}
.table-scroll table{min-width:100%;margin:0}.table-scroll th,.table-scroll td{padding:9px 7px;font-size:12px}
.table-scroll td button{min-width:36px;min-height:36px;margin:2px;padding:5px;background:#f2edfc}
.detail-modal-content{max-width:700px;max-height:85vh;max-height:85dvh}
.detail-modal-content .modal-body{padding:0 10px 12px}.detail-modal-content table{min-width:100%}.detail-modal-content th{top:0;z-index:3}.detail-modal-content th,.detail-modal-content td{padding:11px 9px}.detail-modal-content td{white-space:nowrap}
.spinner{display:inline-block;width:16px;height:16px;flex-shrink:0;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.access-screen{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#f6f5fb,#eee5ff)}
.access-card{width:100%;max-width:360px;padding:30px 22px;text-align:center;background:#fff;border-radius:22px;box-shadow:0 12px 40px rgba(43,25,83,.12)}
.access-card h2,.access-card h3{margin:12px 0 8px;color:#242033}.access-card p{color:#777386;font-size:14px}
.loading-spinner{width:44px;height:44px;margin:0 auto 20px;border:4px solid #e9ddff;border-top-color:#6200ea;border-radius:50%;animation:spin .75s linear infinite}
.lock-icon{font-size:40px}.passcode-digits{display:flex;justify-content:center;gap:12px;margin:24px 0 12px}
.passcode-digit{width:52px;height:58px;min-height:58px;margin:0;padding:0;text-align:center;font-size:24px;font-weight:750;border:1px solid #ded9e9;border-radius:12px;background:#fbfaff}
.passcode-error{min-height:21px;margin:8px 0 12px;color:var(--danger)!important}
#unlockBtn{width:100%;color:#fff;background:#6200ea}#unlockBtn:disabled{opacity:.65}
@media(max-width:360px){header{font-size:17px;padding-left:10px;padding-right:10px}.dashboard,.category-section{padding-left:10px;padding-right:10px}.card{padding:15px}#categoryCards{gap:8px}.category-card{min-height:90px;padding:12px 9px}.daily-table-wrapper{margin-right:10px;margin-left:10px}.modal{padding:8px}.modal-header{padding:11px}.modal-header h3{font-size:16px}.modal-body{padding:12px}.passcode-digits{gap:8px}.passcode-digit{width:48px;height:54px}}
@media(min-width:600px){body{max-width:1100px;margin:0 auto;padding-bottom:35px}header{border-radius:0 0 15px 15px}.dashboard{grid-template-columns:minmax(280px,420px);padding:24px 20px 10px}.category-section{padding:18px 20px}#categoryCards{grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:14px}.category-card{padding:18px}.category-card:hover{box-shadow:0 7px 20px rgba(43,25,83,.1);transform:translateY(-2px)}.daily-table-wrapper{margin:0 20px 25px}.modal-body{padding:20px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<!-- Loading and passcode screens stay above the app until verification succeeds. -->
<div id="loadingScreen" class="access-screen" role="status" aria-live="polite">
  <div class="access-card"><div class="loading-spinner"></div><h3>Daily Expense Tracker</h3><p id="loadingMessage">Connecting securely...</p></div>
</div>
<div id="passcodeScreen" class="access-screen" style="display:none">
  <div class="access-card">
    <div class="lock-icon">🔐</div><h2>Welcome Back</h2><p>Enter your 4-digit passcode to continue.</p>
    <div class="passcode-digits">
      <input class="passcode-digit" type="password" inputmode="numeric" maxlength="1" aria-label="Digit 1" autocomplete="off">
      <input class="passcode-digit" type="password" inputmode="numeric" maxlength="1" aria-label="Digit 2" autocomplete="off">
      <input class="passcode-digit" type="password" inputmode="numeric" maxlength="1" aria-label="Digit 3" autocomplete="off">
      <input class="passcode-digit" type="password" inputmode="numeric" maxlength="1" aria-label="Digit 4" autocomplete="off">
    </div>
    <p id="passcodeError" class="passcode-error" role="alert"></p>
    <button id="unlockBtn" type="button" onclick="unlockApp()">Unlock</button>
  </div>
</div>

<!-- The entire tracker is hidden until the passcode has been verified. -->
<div id="appContent" style="display:none">
<header>💰 Daily Expense Tracker</header>
<div class="dashboard">
  <div class="card">
    <h3>Total</h3>
    <select id="filter">
      <option value="month">Month</option><option value="all">All Time</option><option value="range">Date Range</option>
    </select>
    <div class="date-range" id="dateRange">
      <label>From Date</label><input type="date" id="fromDate">
      <label>To Date</label><input type="date" id="toDate">
    </div>
    <p id="totalExpense">₹0</p>
  </div>
</div>
<div class="category-section"><h3>Spending by Category</h3><div id="categoryCards"></div></div>
<div class="daily-table-wrapper">
  <table><thead><tr><th>Date</th><th>Total</th></tr></thead><tbody id="expenseTable"></tbody></table>
</div>
<button class="add-btn" onclick="openModal()" aria-label="Add expense" title="Add expense">+</button>

<!-- Add expense modal -->
<div class="modal" id="expenseModal">
  <div class="modal-content">
    <div class="modal-header"><h3 id="expenseModalTitle">Add Expense</h3><button type="button" class="close-btn" onclick="closeModal()" aria-label="Close add expense" title="Close">×</button></div>
    <div class="modal-body">
      <select id="category" onchange="toggleOtherField()">
        <option>Breakfast</option><option>Lunch</option><option>Dinner</option><option>Snacks</option><option>Travel</option><option>Grocery</option><option>Housing</option><option>Others</option>
      </select>
      <input id="product" placeholder="Item name" style="display:none" autocomplete="off">
      <input id="amount" type="number" placeholder="Amount" min="0.01" step="0.01" inputmode="decimal">
      <select id="payment"><option>GPay</option><option>Cash</option></select>
      <input id="date" type="date">
      <button id="addItemBtn" onclick="addItem()">Add Item</button>
      <div class="table-scroll">
        <table><thead><tr><th>Cat</th><th>Item</th><th>Amt</th><th>Date</th><th>Actions</th></tr></thead><tbody id="tempBody"></tbody></table>
      </div>
      <div class="modal-actions"><button id="submitBtn" onclick="submitAll()">Submit All</button><button type="button" onclick="closeModal()">Cancel</button></div>
    </div>
  </div>
</div>

<!-- Date details modal -->
<div class="modal" id="detailModal">
  <div class="modal-content detail-modal-content">
    <div class="modal-header"><h3 id="detailDate">Date details</h3><button type="button" class="close-btn" onclick="closeDetailModal()" aria-label="Close date details" title="Close">×</button></div>
    <div class="modal-body"><div class="table-scroll"><table><thead><tr><th>Category</th><th>Amount</th><th>Pay</th></tr></thead><tbody id="detailBody"></tbody></table></div></div>
  </div>
</div>

<!-- Category details modal -->
<div class="modal" id="categoryModal">
  <div class="modal-content detail-modal-content">
    <div class="modal-header"><h3 id="categoryTitle">Category Spending</h3><button type="button" class="close-btn" onclick="closeCategoryModal()" aria-label="Close category details" title="Close">×</button></div>
    <div class="modal-body"><div class="table-scroll"><table><thead><tr><th>Date</th><th>Category</th><th>Item</th><th>Amount</th><th>Payment</th></tr></thead><tbody id="categoryDetailBody"></tbody></table></div></div>
  </div>
</div>
</div><!-- /appContent -->

<script>
"use strict";
const apiUrl = "__APPS_SCRIPT_URL__";
let expenses = [];
let temp = [];
let editingIndex = -1;
let unlocking = false;

const $ = id => document.getElementById(id);
const filter = $("filter"), dateRange = $("dateRange"), fromDate = $("fromDate"), toDate = $("toDate");
const totalExpense = $("totalExpense"), expenseTable = $("expenseTable"), categoryCards = $("categoryCards");
const categoryModal = $("categoryModal"), categoryTitle = $("categoryTitle"), categoryDetailBody = $("categoryDetailBody");
const expenseModal = $("expenseModal"), detailModal = $("detailModal"), category = $("category"), product = $("product");
const amount = $("amount"), payment = $("payment"), date = $("date"), tempBody = $("tempBody");
const detailDate = $("detailDate"), detailBody = $("detailBody"), submitBtn = $("submitBtn");
const addItemBtn = $("addItemBtn"), expenseModalTitle = $("expenseModalTitle");
const loadingScreen = $("loadingScreen"), loadingMessage = $("loadingMessage"), passcodeScreen = $("passcodeScreen");
const passcodeError = $("passcodeError"), unlockBtn = $("unlockBtn");
const passcodeDigits = [...document.querySelectorAll(".passcode-digit")];

function formatDate(value) {
  if (!value) return "";
  const parts = String(value).slice(0, 10).split("-");
  if (parts.length !== 3) return String(value);
  return `${parts[2]}-${parts[1]}-${parts[0]}`;
}
function getToday() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function escapeHtml(value) {
  return String(value ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}
function escapeJs(value) {
  return String(value).replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/\n/g,"\\n").replace(/\r/g,"\\r");
}
async function post(payload) {
  const response = await fetch(apiUrl,{method:"POST",body:new URLSearchParams(payload)});
  if (!response.ok) throw new Error("Server returned HTTP " + response.status);
  return response.json();
}
async function load() {
  const data = await post({action:"getAll"});
  if (data.status === "error") throw new Error(data.message || "Apps Script returned an error");
  expenses = Array.isArray(data.expenses) ? data.expenses : [];
  render();
}

filter.addEventListener("change",function(){
  dateRange.style.display = filter.value === "range" ? "block" : "none";
  if (filter.value !== "range") { fromDate.value = ""; toDate.value = ""; }
  render();
});
fromDate.addEventListener("change",render);
toDate.addEventListener("change",render);

function isInSelectedDateRange(d) {
  const now = new Date();
  if (filter.value === "month") {
    const currentMonth = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`;
    if (d.slice(0,7) !== currentMonth) return false;
  }
  if (filter.value === "range") {
    if (fromDate.value && d < fromDate.value) return false;
    if (toDate.value && d > toDate.value) return false;
  }
  return true;
}
function render() {
  const dailyTotals = {}, categoryTotals = {};
  let total = 0;
  expenses.forEach(e => {
    const d = String(e.Date || "").slice(0,10);
    if (!d || !isInSelectedDateRange(d)) return;
    const value = Number(e.Amount) || 0;
    dailyTotals[d] = (dailyTotals[d] || 0) + value;
    total += value;
    const main = String(e.MainCategory || "").trim();
    if (main) categoryTotals[main] = (categoryTotals[main] || 0) + value;
  });
  totalExpense.textContent = "₹" + total.toLocaleString("en-IN");
  const dates = Object.keys(dailyTotals).sort((a,b)=>b.localeCompare(a));
  expenseTable.innerHTML = dates.length ? dates.map(d =>
    `<tr onclick="openDay('${escapeJs(d)}')"><td>${formatDate(d)}</td><td>₹${dailyTotals[d].toLocaleString("en-IN")}</td></tr>`
  ).join("") : '<tr><td colspan="2">No expenses found</td></tr>';
  const categories = Object.keys(categoryTotals).sort((a,b)=>categoryTotals[b]-categoryTotals[a]);
  categoryCards.innerHTML = categories.length ? categories.map(main =>
    `<div class="category-card" role="button" tabindex="0" onclick="openCategory('${escapeJs(main)}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openCategory('${escapeJs(main)}')}"><h4>${escapeHtml(main)}</h4><p>₹${categoryTotals[main].toLocaleString("en-IN")}</p></div>`
  ).join("") : '<div class="category-card"><h4>No Data</h4><p>₹0</p></div>';
}

function openDay(selectedDate) {
  detailDate.textContent = formatDate(selectedDate);
  const rows = expenses.filter(e=>String(e.Date || "").slice(0,10)===selectedDate)
    .sort((a,b)=>String(a.Date).localeCompare(String(b.Date)));
  detailBody.innerHTML = rows.length ? rows.map(e=>{
    const shown = e.Category === "Others" ? (e.Item || "-") : (e.Category || "-");
    return `<tr><td>${escapeHtml(shown)}</td><td>₹${(Number(e.Amount)||0).toLocaleString("en-IN")}</td><td>${escapeHtml(e.PaymentMode || "-")}</td></tr>`;
  }).join("") : '<tr><td colspan="3">No expenses found</td></tr>';
  detailModal.style.display = "flex";
}
function closeDetailModal(){ detailModal.style.display = "none"; }
function closeCategoryModal(){ categoryModal.style.display = "none"; }

function openCategory(mainCategory) {
  categoryTitle.textContent = mainCategory + " Spending";
  const rows = expenses.filter(e=>{
    if (String(e.MainCategory || "").trim().toLowerCase() !== mainCategory.toLowerCase()) return false;
    return isInSelectedDateRange(String(e.Date || "").slice(0,10));
  }).sort((a,b)=>String(b.Date).localeCompare(String(a.Date)));
  categoryDetailBody.innerHTML = rows.length ? rows.map(e=>{
    const categoriesWithItem = ["Travel","Grocery","Housing","Others"];
    const itemName = categoriesWithItem.includes(e.Category) ? (e.Item || "-") : "-";
    return `<tr><td>${formatDate(e.Date)}</td><td>${escapeHtml(e.Category || "-")}</td><td>${escapeHtml(itemName)}</td><td>₹${(Number(e.Amount)||0).toLocaleString("en-IN")}</td><td>${escapeHtml(e.PaymentMode || "-")}</td></tr>`;
  }).join("") : '<tr><td colspan="5">No expenses found</td></tr>';
  categoryModal.style.display = "flex";
}

function openModal() {
  resetEntryForm();
  date.value = getToday();
  expenseModalTitle.textContent = "Add Expense";
  addItemBtn.textContent = "Add Item";
  expenseModal.style.display = "flex";
}
function resetEntryForm() {
  category.value = "Breakfast"; product.value = ""; amount.value = "";
  payment.value = "GPay"; date.value = getToday(); editingIndex = -1;
  toggleOtherField(false);
}
function closeModal() {
  expenseModal.style.display = "none";
  temp = []; editingIndex = -1; drawTemp(); resetEntryForm();
  addItemBtn.textContent = "Add Item";
}
function toggleOtherField(shouldFocus = false) {
  const show = ["Travel","Grocery","Housing","Others"].includes(category.value);
  product.style.display = show ? "block" : "none";
  if (show) { product.placeholder = category.value === "Others" ? "Item name (required)" : "Item name (optional)"; if (shouldFocus) product.focus(); }
  else product.value = "";
}
category.addEventListener("change",()=>toggleOtherField(false));

function addItem() {
  const value = Number(amount.value);
  if (!date.value || !amount.value || !Number.isFinite(value) || value <= 0) {
    alert("Please enter a valid amount greater than 0 and select a date."); return;
  }
  const itemValue = product.value.trim();
  if (category.value === "Others" && !itemValue) {
    alert("Please enter item name for Others category."); product.focus(); return;
  }
  const item = {category:category.value,item:itemValue || "-",amount:value,payment:payment.value,date:date.value};
  if (editingIndex >= 0) {
    temp[editingIndex] = item;
    editingIndex = -1;
    addItemBtn.textContent = "Add Item";
  } else temp.push(item);
  drawTemp();
  resetEntryForm();
  amount.focus();
}
function drawTemp() {
  tempBody.innerHTML = temp.length ? temp.map((item,index)=>`
    <tr><td>${escapeHtml(item.category)}</td><td>${escapeHtml(item.item)}</td><td>₹${item.amount.toLocaleString("en-IN")}</td><td>${formatDate(item.date)}</td>
    <td><button type="button" onclick="editTempItem(${index})" title="Edit item" aria-label="Edit item">✏️</button><button type="button" onclick="removeTempItem(${index})" title="Delete item" aria-label="Delete item">🗑️</button></td></tr>
  `).join("") : '<tr><td colspan="5">No items added yet</td></tr>';
}
function editTempItem(index) {
  const item = temp[index]; if (!item) return;
  editingIndex = index;
  category.value = item.category; product.value = item.item === "-" ? "" : item.item;
  amount.value = item.amount; payment.value = item.payment; date.value = item.date;
  toggleOtherField(false);
  if (["Travel","Grocery","Housing","Others"].includes(category.value)) product.value = item.item === "-" ? "" : item.item;
  addItemBtn.textContent = "Update Item";
  expenseModalTitle.textContent = "Edit Expense Item";
  amount.focus();
}
function removeTempItem(index) {
  if (index < 0 || index >= temp.length) return;
  temp.splice(index,1);
  if (editingIndex === index) { resetEntryForm(); addItemBtn.textContent = "Add Item"; expenseModalTitle.textContent = "Add Expense"; }
  else if (editingIndex > index) editingIndex--;
  drawTemp();
}

async function submitAll() {
  if (!temp.length) { alert("Add at least one item."); return; }
  if (editingIndex >= 0) { alert("Please tap Update Item to finish editing before submitting."); return; }
  const originalText = submitBtn.innerHTML;
  submitBtn.disabled = true;
  submitBtn.innerHTML = '<span class="spinner"></span> Saving...';
  try {
    // Save each queued item. If a later item fails, already-saved rows remain in the sheet.
    for (const item of temp) {
      const result = await post({action:"add",category:item.category,item:item.item,amount:String(item.amount),payment:item.payment,date:item.date});
      if (result.status !== "ok") throw new Error(result.message || "Google Sheet did not confirm the save.");
    }
    submitBtn.textContent = "✓ Saved";
    await load();
    setTimeout(()=>{closeModal();submitBtn.disabled=false;submitBtn.innerHTML=originalText;},450);
  } catch(error) {
    console.error("Save error:",error);
    alert("Unable to save all expenses. Please check the sheet before retrying to avoid duplicate entries.\n\n"+error.message);
    submitBtn.disabled = false; submitBtn.innerHTML = originalText;
  }
}

function showPasscodeScreen(message) {
  loadingScreen.style.display = "none";
  passcodeScreen.style.display = "flex";
  if (message) passcodeError.textContent = message;
}
passcodeDigits.forEach((input,index)=>{
  input.addEventListener("input",()=>{
    input.value = input.value.replace(/\D/g,"").slice(-1);
    if (input.value && index < passcodeDigits.length-1) passcodeDigits[index+1].focus();
    passcodeError.textContent = "";
    if (passcodeDigits.every(el=>el.value)) unlockApp();
  });
  input.addEventListener("keydown",event=>{
    if (event.key==="Backspace" && !input.value && index>0) passcodeDigits[index-1].focus();
    if (event.key==="ArrowLeft" && index>0) passcodeDigits[index-1].focus();
    if (event.key==="ArrowRight" && index<passcodeDigits.length-1) passcodeDigits[index+1].focus();
    if (event.key==="Enter") unlockApp();
  });
  input.addEventListener("paste",event=>{
    event.preventDefault();
    const pasted=event.clipboardData.getData("text").replace(/\D/g,"").slice(0,4);
    passcodeDigits.forEach((el,i)=>el.value=pasted[i]||"");
    passcodeDigits[Math.min(pasted.length,3)].focus();
    passcodeError.textContent="";
    if (pasted.length===4) unlockApp();
  });
});
async function verifyPasscode(passcode) {
  return post({action:"verifyPasscode",passcode});
}
async function unlockApp() {
  if (unlocking) return;
  const passcode=passcodeDigits.map(input=>input.value).join("");
  if (!/^\d{4}$/.test(passcode)) {
    passcodeError.textContent="Enter all 4 digits.";
    (passcodeDigits.find(input=>!input.value)||passcodeDigits[0]).focus(); return;
  }
  unlocking=true; unlockBtn.disabled=true; unlockBtn.textContent="Verifying...";
  passcodeError.textContent="";
  try {
    const result=await verifyPasscode(passcode);
    if (result.status!=="ok") {
      passcodeError.textContent=result.status==="invalid"?"Incorrect passcode. Try again.":(result.message||"Verification failed.");
      passcodeDigits.forEach(input=>input.value=""); passcodeDigits[0].focus(); return;
    }
    passcodeScreen.style.display="none"; loadingScreen.style.display="flex";
    loadingMessage.textContent="Loading your expenses...";
    await load();
    $("appContent").style.display="block";
    loadingScreen.style.display="none";
    passcodeDigits.forEach(input=>input.value="");
  } catch(error) {
    console.error("Unlock/load error:",error);
    showPasscodeScreen("Unable to connect or load expenses. Please try again.");
  } finally {
    unlocking=false; unlockBtn.disabled=false; unlockBtn.textContent="Unlock";
  }
}
async function initializeApp() {
  loadingScreen.style.display="flex"; passcodeScreen.style.display="none"; $("appContent").style.display="none";
  try {
    // An empty passcode should return "invalid" when the server-side passcode is configured.
    const result=await verifyPasscode("");
    if (result.status==="invalid") {
      loadingScreen.style.display="none"; passcodeScreen.style.display="flex"; passcodeDigits[0].focus();
    } else {
      showPasscodeScreen(result.message || "Passcode service is not configured. Check Apps Script.");
    }
  } catch(error) {
    console.error("Startup check error:",error);
    showPasscodeScreen("Unable to connect. Check your internet and refresh the page.");
  }
}
document.querySelectorAll(".modal").forEach(modal=>{
  modal.addEventListener("click",event=>{if(event.target===modal){modal.style.display="none";}});
});
document.addEventListener("keydown",event=>{
  if(event.key==="Escape"){
    if(expenseModal.style.display==="flex") closeModal();
    if(detailModal.style.display==="flex") closeDetailModal();
    if(categoryModal.style.display==="flex") closeCategoryModal();
  }
});
initializeApp();
</script>
