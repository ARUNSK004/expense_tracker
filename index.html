<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expense Tracker</title>

<style>
body { font-family: Arial; margin:0; background:#f5f6fa; }
header { background:#6200ea; color:white; padding:15px; text-align:center; }
.dashboard { display:flex; gap:10px; padding:10px; }
.card { background:white; flex:1; padding:10px; border-radius:10px; text-align:center; }
table { width:100%; border-collapse:collapse; margin-top:10px; }
th,td { border:1px solid #ddd; padding:8px; text-align:center; }
th { background:#eee; }

.modal {
  display:none; position:fixed; inset:0;
  background:rgba(0,0,0,.6);
  justify-content:center; align-items:center;
}
.modal-content {
  background:white; width:90%; max-width:400px;
  max-height:80%; overflow:auto;
  padding:15px; border-radius:10px;
}
button { padding:8px; border:none; border-radius:6px; cursor:pointer; }
</style>
</head>

<body>
<header>💰 Daily Expense Tracker</header>

<div class="dashboard">
  <div class="card">
    <h3>Total</h3>
    <select id="filter">
      <option value="month">This Month</option>
      <option value="week">This Week</option>
      <option value="all">All Time</option>
    </select>
    <p id="total">₹0</p>
  </div>

  <div class="card">
    <h3>GPay ✏️</h3>
    <p id="gpay">₹0</p>
    <button onclick="editBalance('GPay')">Edit</button>
  </div>

  <div class="card">
    <h3>Cash ✏️</h3>
    <p id="cash">₹0</p>
    <button onclick="editBalance('Cash')">Edit</button>
  </div>
</div>

<table>
<thead>
<tr><th>Date</th><th>Total</th></tr>
</thead>
<tbody id="dateTable"></tbody>
</table>

<!-- DATE DETAILS -->
<div class="modal" id="detailModal">
<div class="modal-content">
<h3 id="detailDate"></h3>
<table>
<thead>
<tr><th>Category</th><th>Amount</th><th>Pay</th></tr>
</thead>
<tbody id="detailBody"></tbody>
</table>
<button onclick="closeDetail()">Close</button>
</div>
</div>

<!-- BALANCE MODAL -->
<div class="modal" id="balanceModal">
<div class="modal-content">
<h3 id="balTitle"></h3>
<input type="number" id="balInput" placeholder="Enter balance">
<button onclick="saveBalance()">Save</button>
<button onclick="closeBal()">Cancel</button>
</div>
</div>

<script>
const api = "https://script.google.com/macros/s/AKfycbylcrgIjAzMEYJx3QamTK6gspIU9_RMjtXjupjd9cFEI4gV4PAnwVOPbLadl8__bog_/exec";

let expenses=[], editType="";

document.getElementById("filter").onchange = render;

async function load() {
  const r = await fetch(api,{method:"POST",body:new URLSearchParams({action:"getAll"})});
  const data = await r.json();
  expenses = data.expenses;

  document.getElementById("gpay").innerText = "₹"+data.gpay;
  document.getElementById("cash").innerText = "₹"+data.cash;

  render();
}

function render(){
  const f = document.getElementById("filter").value;
  let map={}, total=0, now=new Date();

  expenses.forEach(e=>{
    let d=new Date(e.Date);
    if(f==="month" && (d.getMonth()!=now.getMonth()||d.getFullYear()!=now.getFullYear())) return;
    if(f==="week"){
      let w=new Date(); w.setDate(w.getDate()-w.getDay());
      if(d<w) return;
    }
    map[e.Date]=(map[e.Date]||0)+e.Amount;
    total+=e.Amount;
  });

  document.getElementById("total").innerText="₹"+total;

  let tb=document.getElementById("dateTable"); tb.innerHTML="";
  Object.keys(map).sort().forEach(d=>{
    tb.innerHTML+=`<tr onclick="openDetail('${d}')"><td>${d}</td><td>₹${map[d]}</td></tr>`;
  });
}

function openDetail(date){
  document.getElementById("detailDate").innerText=date;
  let b=document.getElementById("detailBody"); b.innerHTML="";
  expenses.filter(e=>e.Date===date).forEach(e=>{
    let cat=e.Category==="Others"?e.Item:e.Category;
    b.innerHTML+=`<tr><td>${cat}</td><td>₹${e.Amount}</td><td>${e.PaymentMode}</td></tr>`;
  });
  document.getElementById("detailModal").style.display="flex";
}
function closeDetail(){detailModal.style.display="none";}

function editBalance(t){
  editType=t;
  balTitle.innerText="Update "+t;
  balanceModal.style.display="flex";
}
function closeBal(){balanceModal.style.display="none";}
async function saveBalance(){
  await fetch(api,{method:"POST",body:new URLSearchParams({
    action:"updateBalance", type:editType, value:balInput.value
  })});
  closeBal(); load();
}

load();
</script>
</body>
</html>
