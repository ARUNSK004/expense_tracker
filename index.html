<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expense Tracker</title>

<style>
body { font-family: Arial; margin:0; background:#f5f6fa; }
header { background:#6200ea; color:white; padding:15px; text-align:center; }
.dashboard { display:flex; gap:10px; padding:10px; }
.card { background:white; flex:1; padding:10px; border-radius:10px; text-align:center; }
table { width:100%; border-collapse:collapse; margin-top:10px; }
th,td { border:1px solid #ddd; padding:8px; text-align:center; }
th { background:#eee; }

.modal {
  display:none; position:fixed; inset:0;
  background:rgba(0,0,0,.6);
  justify-content:center; align-items:center;
}
.modal-content {
  background:white; width:90%; max-width:400px;
  max-height:80%; overflow:auto;
  padding:15px; border-radius:10px;
}
button { padding:8px; border:none; border-radius:6px; cursor:pointer; }
</style>
</head>

<body>
<header>💰 Daily Expense Tracker</header>

<div class="dashboard">
  <div class="card">
    <h3>Total</h3>
    <select id="filter">
      <option value="month">This Month</option>
      <option value="week">This Week</option>
      <option value="all">All Time</option>
    </select>
    <p id="total">₹0</p>
  </div>

  <div class="card">
    <h3>GPay ✏️</h3>
    <p id="gpay">₹0</p>
    <button onclick="editBalance('GPay')">Edit</button>
  </div>

  <div class="card">
    <h3>Cash ✏️</h3>
    <p id="cash">₹0</p>
    <button onclick="editBalance('Cash')">Edit</button>
  </div>
</div>

<table>
<thead>
<tr><th>Date</th><th>Total</th></tr>
</thead>
<tbody id="dateTable"></tbody>
</table>

<!-- DATE DETAILS -->
<div class="modal" id="detailModal">
<div class="modal-content">
<h3 id="detailDate"></h3>
<table>
<thead>
<tr><th>Category</th><th>Amount</th><th>Pay</th></tr>
</thead>
<tbody id="detailBody"></tbody>
</table>
<button onclick="closeDetail()">Close</button>
</div>
</div>

<!-- BALANCE MODAL -->
<div class="modal" id="balanceModal">
<div class="modal-content">
<h3 id="balTitle"></h3>
<input type="number" id="balInput" placeholder="Enter balance">
<button onclick="saveBalance()">Save</button>
<button onclick="closeBal()">Cancel</button>
</div>
</div>

<script>
const apiUrl = "https://script.google.com/macros/s/AKfycbwhIHO0XoXiEdkp2bplU6zGjN4VCMWKBr8ERpZc404pke9cKJ7v1iBre5LVU66mGDYi/exec";

let expensesData = [];
let tempItems = [];
let editingType = "";

/* ---------- DATE HELPERS ---------- */
function formatDateDisplay(dateStr) {
  const d = new Date(dateStr);
  if (isNaN(d)) return dateStr;
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const yy = d.getFullYear();
  return `${dd}-${mm}-${yy}`;
}
function formatYMD(dateStr){
  return new Date(dateStr).toISOString().split("T")[0];
}

/* ---------- LOAD DATA ---------- */
async function loadData(){
  const res = await fetch(apiUrl,{method:"POST",body:new URLSearchParams({action:"getAll"})});
  const data = await res.json();

  expensesData = data.expenses;

  document.getElementById("balanceGPay").innerText = "₹"+data.gpay;
  document.getElementById("balanceCash").innerText = "₹"+data.cash;

  document.getElementById("filter").value="month";
  applyFilter();
}

/* ---------- FILTER ---------- */
function applyFilter(){
  const filter = document.getElementById("filter").value;
  const today = new Date();
  let map={}, total=0;

  expensesData.forEach(e=>{
    const d = new Date(e.Date);
    if(filter==="month" && (d.getMonth()!=today.getMonth() || d.getFullYear()!=today.getFullYear())) return;
    if(filter==="week"){
      const w = new Date(); w.setDate(w.getDate()-w.getDay());
      if(d<w) return;
    }
    const key = formatYMD(e.Date);
    map[key] = (map[key]||0)+Number(e.Amount);
    total+=Number(e.Amount);
  });

  document.getElementById("totalExpense").innerText="₹"+total.toFixed(2);

  renderDateTable(map);
}

/* ---------- DATE TABLE (DESC ORDER) ---------- */
function renderDateTable(map){
  const tbody = document.getElementById("expenseTable");
  tbody.innerHTML="";

  Object.keys(map)
    .sort((a,b)=> new Date(b)-new Date(a))   // DESC
    .forEach(d=>{
      tbody.innerHTML+=`
        <tr onclick="openDayDetail('${d}')">
          <td>${formatDateDisplay(d)}</td>
          <td>₹${map[d].toFixed(2)}</td>
        </tr>`;
    });
}

/* ---------- DATE DETAIL ---------- */
function openDayDetail(date){
  document.getElementById("detailDate").innerText=formatDateDisplay(date);
  const body=document.getElementById("detailBody");
  body.innerHTML="";

  expensesData
    .filter(e=>formatYMD(e.Date)===date)
    .forEach(e=>{
      const cat = e.Category==="Others" ? e.Item : e.Category;
      body.innerHTML+=`
        <tr>
          <td>${cat}</td>
          <td>₹${e.Amount}</td>
          <td>${e.PaymentMode}</td>
        </tr>`;
    });

  document.getElementById("detailModal").style.display="flex";
}
function closeDetail(){detailModal.style.display="none";}

/* ---------- ADD EXPENSE (UNCHANGED) ---------- */
function openModal(){expenseModal.style.display="flex";}
function closeModal(){expenseModal.style.display="none"; tempItems=[]; renderTemp();}
function toggleOtherField(){
  product.style.display = category.value==="Others"?"block":"none";
}
function addItem(){
  if(!amount.value||!date.value) return alert("Amount & date required");
  tempItems.push({
    category:category.value,
    item:product.value||"-",
    amount:amount.value,
    payment:payment.value,
    date:date.value
  });
  renderTemp();
}
function renderTemp(){
  tempTable.querySelector("tbody").innerHTML=tempItems.map((i,idx)=>`
    <tr>
      <td>${i.category}</td>
      <td>${i.item}</td>
      <td>₹${i.amount}</td>
      <td>${i.payment}</td>
      <td>${i.date}</td>
      <td><button onclick="tempItems.splice(${idx},1);renderTemp()">❌</button></td>
    </tr>`).join("");
}
async function submitAll(){
  for(const i of tempItems){
    await fetch(apiUrl,{method:"POST",body:new URLSearchParams({
      action:"add",
      date:i.date,
      category:i.category,
      item:i.item,
      amount:i.amount,
      paymentMode:i.payment
    })});
  }
  closeModal(); loadData();
}

/* ---------- BALANCE ---------- */
function editBalance(t){
  editingType=t;
  balanceType.innerText="Update "+t;
  balanceModal.style.display="flex";
}
async function saveBalance(){
  await fetch(apiUrl,{method:"POST",body:new URLSearchParams({
    action:"updateBalance",
    type:editingType,
    value:newBalance.value
  })});
  balanceModal.style.display="none";
  loadData();
}
function closeBalanceModal(){balanceModal.style.display="none";}

document.addEventListener("DOMContentLoaded",loadData);
</script>

</body>
</html>
