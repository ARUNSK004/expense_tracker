<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Expense Tracker</title>

<style>
body{font-family:Arial;margin:0;background:#f5f6fa}
header{background:#6200ea;color:#fff;padding:15px;text-align:center}
.dashboard{display:flex;gap:10px;padding:10px}
.card{background:#fff;flex:1;padding:10px;border-radius:10px;text-align:center}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border:1px solid #ddd;padding:8px;text-align:center}
th{background:#eee}
.add-btn{position:fixed;right:20px;bottom:20px;width:60px;height:60px;
border-radius:50%;font-size:30px;border:none;background:#6200ea;color:#fff}

.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);
justify-content:center;align-items:center}
.modal-content{background:#fff;width:90%;max-width:400px;
max-height:85%;overflow:auto;padding:15px;border-radius:10px}
input,select{width:100%;padding:8px;margin:5px 0}
button{padding:8px;border:none;border-radius:6px;cursor:pointer}
</style>
</head>

<body>
<header>💰 Daily Expense Tracker</header>

<div class="dashboard">
  <div class="card">
    <h3>Total</h3>
    <select id="filter">
      <option value="month">Month</option>
      <option value="week">Week</option>
      <option value="all">All Time</option>
    </select>
    <p id="totalExpense">₹0</p>
  </div>

  <div class="card">
    <h3>GPay ✏️</h3>
    <p id="balanceGPay">₹0</p>
    <button onclick="editBalance('GPay')">Edit</button>
  </div>

  <div class="card">
    <h3>Cash ✏️</h3>
    <p id="balanceCash">₹0</p>
    <button onclick="editBalance('Cash')">Edit</button>
  </div>
</div>

<table>
<thead><tr><th>Date</th><th>Total</th></tr></thead>
<tbody id="expenseTable"></tbody>
</table>

<button class="add-btn" onclick="openModal()">+</button>

<!-- ADD EXPENSE -->
<div class="modal" id="expenseModal">
<div class="modal-content">
<h3>Add Expense</h3>

<select id="category" onchange="toggleOtherField()">
<option>Breakfast</option>
<option>Lunch</option>
<option>Dinner</option>
<option>Snacks</option>
<option>Others</option>
</select>

<input id="product" placeholder="Item name" style="display:none">
<input id="amount" type="number" placeholder="Amount">
<select id="payment"><option>GPay</option><option>Cash</option></select>
<input id="date" type="date">

<button onclick="addItem()">Add Item</button>

<table>
<thead><tr><th>Cat</th><th>Item</th><th>Amt</th><th>Pay</th><th></th></tr></thead>
<tbody id="tempBody"></tbody>
</table>

<button onclick="submitAll()">Submit All</button>
<button onclick="closeModal()">Cancel</button>
</div>
</div>

<!-- DATE DETAIL -->
<div class="modal" id="detailModal">
<div class="modal-content">
<h3 id="detailDate"></h3>
<table>
<thead><tr><th>Category</th><th>Amount</th><th>Pay</th></tr></thead>
<tbody id="detailBody"></tbody>
</table>
<button onclick="detailModal.style.display='none'">Close</button>
</div>
</div>

<!-- BALANCE -->
<div class="modal" id="balanceModal">
<div class="modal-content">
<h3 id="balanceType"></h3>
<input id="newBalance" type="number">
<button onclick="saveBalance()">Save</button>
<button onclick="balanceModal.style.display='none'">Cancel</button>
</div>
</div>

<script>
const apiUrl="https://script.google.com/macros/s/AKfycbxG5iEm88BYbY44RE4IRffi0-I0uADDfAYN0jpEOPPpByvLL4eWflUVKyLAolRmWDTg/exec";
let expenses=[],temp=[],editType="";

const f = (d) => {
  const [y, m, day] = d.split("-");
  return `${day}-${m}-${y}`; // UI only
};
const ymd = d => d;


document.getElementById("filter").onchange=render;

async function load(){
  const r=await fetch(apiUrl,{method:"POST",body:new URLSearchParams({action:"getAll"})});
  const d=await r.json();
  expenses=d.expenses;
  balanceGPay.innerText="₹"+d.gpay;
  balanceCash.innerText="₹"+d.cash;
  render();
}

function render(){
  let m = {}, t = 0;
  let now = new Date();
  let filt = filter.value;

  expenses.forEach(e => {
    let d = new Date(e.Date + "T00:00:00"); // ✅ FIXED

    if (filt === "month" &&
        (d.getMonth() !== now.getMonth() ||
         d.getFullYear() !== now.getFullYear())) return;

    if (filt === "week") {
      let w = new Date();
      w.setDate(w.getDate() - w.getDay());
      w.setHours(0,0,0,0);
      if (d < w) return;
    }

    let key = e.Date; // ✅ STRING DATE
    m[key] = (m[key] || 0) + e.Amount;
    t += e.Amount;
  });

  totalExpense.innerText = "₹" + t;

  expenseTable.innerHTML = Object.keys(m)
    .sort((a, b) => b.localeCompare(a)) // ✅ DESC (31,30,29)
    .map(d =>
      `<tr onclick="openDay('${d}')">
        <td>${f(d)}</td>
        <td>₹${m[d]}</td>
      </tr>`
    ).join("");
}


function openDay(d){
  detailDate.innerText = f(d);
  detailBody.innerHTML = expenses
    .filter(e => e.Date === d)
    .map(e =>
      `<tr>
        <td>${e.Category === "Others" ? e.Item : e.Category}</td>
        <td>₹${e.Amount}</td>
        <td>${e.PaymentMode}</td>
      </tr>`
    ).join("");

  detailModal.style.display = "flex";
}


function openModal(){expenseModal.style.display="flex"}
function closeModal(){expenseModal.style.display="none";temp=[];drawTemp()}
function toggleOtherField(){product.style.display=category.value==="Others"?"block":"none"}

function addItem(){
  if(!amount.value||!date.value)return alert("Required");
  temp.push({category:category.value,item:product.value||"-",amount:amount.value,payment:payment.value,date:date.value});
  drawTemp();
}
function drawTemp(){
  tempBody.innerHTML=temp.map((i,x)=>`<tr><td>${i.category}</td><td>${i.item}</td><td>${i.amount}</td><td>${i.payment}</td><td><button onclick="temp.splice(${x},1);drawTemp()">❌</button></td></tr>`).join("");
}
async function submitAll(){
  for(let i of temp){
    await fetch(apiUrl,{method:"POST",body:new URLSearchParams({action:"add",...i})});
  }
  closeModal(); load();
}

function editBalance(t){editType=t;balanceType.innerText="Update "+t;balanceModal.style.display="flex"}
async function saveBalance(){
  await fetch(apiUrl,{method:"POST",body:new URLSearchParams({action:"updateBalance",type:editType,value:newBalance.value})});
  balanceModal.style.display="none"; load();
}

load();
</script>
</body>
</html>
