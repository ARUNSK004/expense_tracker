
name: Deploy static HTML to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject Apps Script URL
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
        run: |
          test -n "$APPS_SCRIPT_URL" || {
            echo "Missing APPS_SCRIPT_URL secret"
            exit 1
          }

          python3 - <<'PY'
          import os
          from pathlib import Path

          file = Path("index.html")
          html = file.read_text(encoding="utf-8")
          placeholder = "__APPS_SCRIPT_URL__"
          url = os.environ["APPS_SCRIPT_URL"]

          if html.count(placeholder) != 1:
              raise SystemExit(
                  "Expected exactly one Apps Script URL placeholder"
              )

          if not url.startswith(
              "https://script.google.com/macros/s/"
          ) or not url.endswith("/exec"):
              raise SystemExit("Invalid Apps Script Web App URL")

          html = html.replace(placeholder, url)
          file.write_text(html, encoding="utf-8")
          PY

      - name: Upload static files
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
